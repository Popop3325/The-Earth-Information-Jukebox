<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Information Jukebox</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
</head>
<body>
  <header>
    <h1>Earth Information Jukebox</h1>
    <p>Візуалізації NASA, перетворені на звук. <a href="/game">🎮 Гра «Почуй, як змінюється Земля»</a></p>
  </header>

  <main>
    <section aria-labelledby="list-title">
      <h2 id="list-title">Оберіть візуалізацію</h2>
      <ul id="video-list" class="video-list"></ul>
    </section>

    <section aria-labelledby="player-title">
      <h2 id="player-title">Плеєр</h2>
      <!-- Відео не показуємо напряму: кожен кадр копіюється на canvas, і лише обраний регіон (crop).
           Так обрізка працює в усіх браузерах (CSS object-view-box є лише в Chromium). -->
      <div class="screen">
        <canvas id="view" role="img" aria-label="Відео NASA: обраний регіон"></canvas>
        <video id="video" muted playsinline preload="auto"></video>
      </div>
      <div class="seek">
        <button id="toggle-btn" type="button" aria-label="Пауза або відтворення">⏯</button>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Позиція у відео">
        <span id="time" class="time">0:00 / 0:00</span>
      </div>
      <p id="video-note" class="note"></p>
      <div class="controls">
        <button id="play-btn" type="button">▶ Грати зі звуком</button>
        <button id="stop-btn" type="button">■ Стоп</button>
        <label>Звучання: <select id="preset"></select></label>
      </div>
      <!-- Технічний статус (оновлюється часто, тому НЕ aria-live, щоб не заважати скрінрідеру) -->
      <p id="status" class="status"></p>

      <!-- Пояснення: які дані зараз і у що вони перетворюються. Оновлюється під час гри. -->
      <section id="explain" class="explain" hidden aria-labelledby="explain-title">
        <h3 id="explain-title">Що зараз звучить</h3>
        <p id="explain-date" class="explain-date"></p>
        <ul id="explain-rows" class="explain-rows"></ul>
        <fieldset id="mixer" class="mixer">
          <legend>Шари: вимкніть, щоб почути кожен окремо</legend>
        </fieldset>
      </section>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>

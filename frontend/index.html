<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Earth Information Jukebox</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/neuro/neuro.css">
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
</head>
<body class="game-page">
  <!-- Design: team archive. Logic: /static/neuro/main.js. Previous jukebox: /static/classic.html -->
  <div class="story-track" id="story-track">
    <span class="snap-point snap-top" aria-hidden="true"></span>
    <span class="snap-point snap-game" aria-hidden="true"></span>
    <div class="story-sticky">
      <div class="game-shell intro-mode" id="game-shell">
        <header class="game-header">
          <label class="region-pick ctl"><span>Continent</span> <select id="region-select" aria-label="Choose a continent"></select></label>
          <div class="header-tools">
            <button id="listen-all" class="ctl listen-all" type="button" aria-keyshortcuts="Enter" aria-label="Listen to the whole period, 2023 to 2026">
              <span class="ico" aria-hidden="true">🎧</span><span class="lbl">Listen to all</span><kbd aria-hidden="true">Enter</kbd>
            </button>
            <details class="mixer">
              <summary class="ctl" aria-label="Sound volumes"><span aria-hidden="true">♫</span> <span>Sound</span></summary>
              <div class="mixer-panel" aria-label="Sound volumes">
                <label class="track-control"><span><input type="checkbox" data-track-enabled="wind" checked> Wind</span><input type="range" min="0" max="100" value="100" data-track-volume="wind" aria-label="Wind volume"><output>100%</output></label>
                <label class="track-control"><span><input type="checkbox" data-track-enabled="chimes" checked> Chimes</span><input type="range" min="0" max="100" value="100" data-track-volume="chimes" aria-label="Chimes volume"><output>100%</output></label>
                <label class="track-control"><span><input type="checkbox" data-track-enabled="birds" checked> Birds</span><input type="range" min="0" max="100" value="100" data-track-volume="birds" aria-label="Birds volume"><output>100%</output></label>
                <label class="track-control"><span><input type="checkbox" data-track-enabled="music" checked> Music</span><input type="range" min="0" max="100" value="100" data-track-volume="music" aria-label="Music volume: melody, pad, drips, wood"><output>100%</output></label>
              </div>
            </details>
            <button id="voice-toggle" class="ctl icon-only" type="button" aria-label="Turn voice off" aria-pressed="true">🔊</button>
          </div>
        </header>

        <main>
          <section id="screen" aria-label="NASA satellite view of vegetation (NDVI)">
            <video id="video" muted playsinline preload="auto"></video>
            <canvas id="view" class="locked" role="img" aria-label="NASA video of the chosen region"></canvas>
            <div id="screen-overlay">
              <p id="overlay-text">Earth's changes, in sound</p>
              <button id="overlay-btn" class="start-button" type="button" style="display:none;"></button>
            </div>
            <div id="caption" aria-hidden="true"></div>
            <span class="map-tag" id="map-tag">NASA · NDVI</span>
          </section>

          <section class="neuron-stage" aria-label="Timeline: six months, five pairs">
            <canvas id="sky" aria-hidden="true"></canvas>
            <div id="q-float" class="hidden"></div>
            <button id="bell-box" class="bell-button" type="button" aria-keyshortcuts="Space" aria-label="Ring the bell: let nature answer for this pair">
              <span id="bell-icon" aria-hidden="true">🔔</span><span>Ring the bell</span><kbd aria-hidden="true">Space</kbd>
            </button>
            <div id="nodes" aria-label="Months. Listen to each, then choose the answer"></div>
          </section>

          <footer class="game-footer">
            <p id="hint" aria-live="polite"></p>
            <p id="score" class="note"></p>
          </footer>
        </main>
      </div>

      <section class="planet-title" id="planet-title" aria-label="The Earth Information Jukebox">
        <div class="earth-orb" id="earth-orb" aria-hidden="true">
          <div class="earth-texture"></div>
          <div class="earth-clouds"></div>
        </div>
        <p class="eyebrow">NASA SPACE APPS CHALLENGE</p>
        <h1>The Earth<br>Information Jukebox</h1>
        <p class="planet-copy">The planet makes sound. Listen to how it changes.</p>
        <p class="sr-only">Press Space to ring the bell and hear nature answer, or Enter to listen to the whole story from 2023 to 2026.</p>
        <span class="scroll-cue" aria-hidden="true">SCROLL TO EXPLORE <b>↓</b></span>
      </section>
    </div>
  </div>

  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="/static/neuro/main.js"></script>
</body>
</html>

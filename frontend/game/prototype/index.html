<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASA Space Apps: Леса и Нейроны</title>
<style>
  :root { --text:#eef2ea; --accent:#9fd6a0; --focus:#ffd34d; }
  * { box-sizing: border-box; }
  html, body { 
    margin: 0; 
    height: 100%; 
    background: #000; 
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif; 
    overflow: hidden; 
  }
  
  canvas#sky { 
    position: fixed; 
    inset: 0; 
    width: 100%; 
    height: 100%; 
    display: block; 
    z-index: 1; 
  }

  /* Видео контейнер сверху */
  #screen { 
    position: fixed; 
    top: 3vh; 
    left: 50%; 
    transform: translateX(-50%);
    width: min(75vw, 480px); 
    height: 26vh; 
    min-height: 160px;
    border: 1px solid rgba(255,255,255,0.15); 
    border-radius: 12px;
    overflow: visible; 
    background: #050505; 
    box-shadow: 0 0 40px rgba(120,200,255,0.05); 
    z-index: 5;
    display: flex;
  }
  
  #video-container {
    position: relative;
    width: 100%;
    height: 100%;
    flex-grow: 1;
    overflow: hidden;
    border-radius: 12px;
  }
  
  #clip { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block; 
    transition: filter 1s ease; 
  }
  #clip.locked { 
    filter: blur(16px) brightness(0.3); 
  }
  
  #screen-overlay { 
    position: absolute; 
    inset: 0; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center;
    text-align: center; 
    background: rgba(0,0,0,0.6);
    padding: 16px; 
    color: var(--text); 
    z-index: 6;
    transition: opacity 0.3s;
  }
  #screen-overlay.hidden { 
    opacity: 0;
    pointer-events: none;
  }
  
  #caption { 
    position: absolute; 
    left: 0; 
    right: 0; 
    bottom: 0; 
    padding: 8px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
    font-size: 0.95rem; 
    z-index: 6;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #caption.visible { opacity: 1; }

  /* Колокольчик-индикатор */
  #bell-box {
    position: absolute;
    bottom: -45px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: rgba(255,255,255,0.6);
    z-index: 15;
    transition: opacity 0.3s;
  }
  #bell-box.hidden { opacity: 0; pointer-events: none; }
  
  #bell-icon { 
    font-size: 22px; 
    filter: grayscale(0.5); 
    transform-origin: top center;
  }
  #bell-icon.ringing { 
    animation: bell-ring 2.5s ease-in-out; 
    filter: drop-shadow(0 0 12px #ffd34d) grayscale(0); 
  }
  
  @keyframes bell-ring {
    0%, 100% { transform: rotate(0); }
    10%, 30%, 50%, 70%, 90% { transform: rotate(15deg); }
    20%, 40%, 60%, 80% { transform: rotate(-15deg); }
  }

  .btn { 
    font: inherit; 
    font-size: 0.95rem; 
    padding: 10px 18px; 
    border-radius: 8px; 
    cursor: pointer;
    background: rgba(15, 23, 42, 0.8); 
    color: var(--text); 
    border: 1px solid rgba(159,214,160,0.7);
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }
  .btn:hover { background: rgba(159,214,160,0.25); }

  /* Кнопка включения/выключения озвучки */
  #voice-toggle {
    position: absolute;
    top: 2vh;
    right: 4vw;
    z-index: 20;
    padding: 6px 12px;
    font-size: 0.85rem;
    border-radius: 20px;
  }

  /* Плавающий вопрос */
  #q-float {
    position: absolute;
    top: 0; left: 0;
    transform: translate(-50%, -50%);
    background: rgba(8, 10, 8, 0.85);
    border: 1px solid rgba(159, 214, 160, 0.4);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
    backdrop-filter: blur(6px);
    transition: opacity 0.3s;
  }
  #q-float.hidden { opacity: 0; }

  /* Узлы (Нейроны) */
  #nodes { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  .node-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .node-hitbox {
    position: absolute;
    width: 90px; height: 90px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    pointer-events: auto;
  }
  .node-hitbox:focus-visible { outline: 2px dashed var(--focus); outline-offset: 4px; }
  
  .node-ui {
    position: absolute;
    top: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: opacity 0.3s;
    pointer-events: auto;
  }
  .node-wrap.hidden-ui .node-ui {
    opacity: 0;
    pointer-events: none;
  }
  .node-lbl {
    font-size: 1.1rem;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .node-play {
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.6);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .node-play:hover { background: rgba(255,255,255,0.15); }

  #announce { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<!-- Кнопка переключения озвучки -->
<button id="voice-toggle" class="btn">🔊 Озвучка (CapsLock)</button>

<!-- АУДИО ТЕГИ -->
<audio id="audio-birds" src="../../sounds/birds.m4a" loop></audio>
<audio id="audio-wind" src="../../sounds/wind.m4a" loop></audio>
<audio id="audio-chime" src="../../sounds/chime.m4a"></audio>
<audio id="audio-chimes" src="../../sounds/chimes.m4a" loop></audio>

<!-- Видео окно сверху -->
<section id="screen" aria-label="Окно видео">
  <div id="video-container">
    <video id="clip" src="/media/cancun_landcover.mp4" playsinline muted preload="auto" class="locked"></video>
    <div id="screen-overlay">
      <p id="overlay-text" style="margin:0 0 10px; font-size:1.05rem;">Инициализация...</p>
      <button id="overlay-btn" class="btn" style="display:none;">Начать исследование</button>
    </div>
    <div id="caption" aria-hidden="true"></div>
  </div>
  
  <!-- Индикатор режима эха -->
  <div id="bell-box" class="hidden" aria-hidden="true">
    <div id="bell-icon">🔔</div>
    <div style="font-size: 0.75rem; margin-top: 4px;">Пробел</div>
  </div>
</section>

<!-- Плавающий вопрос -->
<div id="q-float" class="hidden">Вопрос загружается...</div>

<!-- Контейнер нейронов -->
<div id="nodes" aria-label="Годы. Нажми на год для ответа"></div>

<div id="announce" role="status" aria-live="polite"></div>

<!-- Подгружаем внешние данные, если есть -->
<script src="data.js" onerror="console.warn('data.js не найден, используем встроенные данные')"></script>

<script>
// ====================== ДАННЫЕ ПРОЕКТА ======================
const defaultFrames = [
  { year: 1987, green: 0.85, built: 0.05 },
  { year: 1993, green: 0.75, built: 0.10 },
  { year: 1999, green: 0.60, built: 0.20 },
  { year: 2005, green: 0.50, built: 0.35 },
  { year: 2011, green: 0.40, built: 0.45 },
  { year: 2018, green: 0.30, built: 0.55 }
];
const DATA = typeof window.CLIP !== 'undefined' ? window.CLIP : {
  years: defaultFrames,
  intervals: [
    { from: 1987, to: 1993, t0: 0.00, t1: 0.54 },
    { from: 1993, to: 1999, t0: 0.54, t1: 1.14 },
    { from: 1999, to: 2005, t0: 1.14, t1: 1.75 },
    { from: 2005, to: 2011, t0: 1.75, t1: 2.38 },
    { from: 2011, to: 2018, t0: 2.38, t1: 3.06 }
  ]
};

const CFG = {
  GREEN_REF: 0.85,
  PAIRS: [[0,1], [1,2], [2,3], [3,4], [4,5]],
  NODE_POS: [
    [0.15, 0.78], [0.28, 0.52], [0.42, 0.78], 
    [0.56, 0.52], [0.70, 0.78], [0.85, 0.52]
  ]
};
const Y = i => DATA.years[i].year;

// Словарь для правильного произношения годов
const YEAR_WORDS = {
  1987: "тысяча девятьсот восемьдесят седьмой",
  1993: "тысяча девятьсот девяносто третий",
  1999: "тысяча девятьсот девяносто девятый",
  2005: "две тысячи пятый",
  2011: "две тысячи одиннадцатый",
  2018: "две тысячи восемнадцатый"
};

// ====================== СОСТОЯНИЕ ИГРЫ ======================
const state = { 
  currentPair: 0, 
  links: [],
  questions: [],
  isPlayingSegment: false,
  errors: 0,
  isFinished: false 
};

// ====================== ОЗВУЧКА (Web Speech API) ======================
let voiceEnabled = true;

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  const voiceToggleBtn = document.getElementById('voice-toggle');
  voiceToggleBtn.textContent = voiceEnabled ? "🔊 Озвучка (CapsLock)" : "🔇 Озвучка (CapsLock)";
  if (!voiceEnabled && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

document.getElementById('voice-toggle').onclick = toggleVoice;

function speak(text) {
  if (!voiceEnabled) return;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel(); 
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

function announce(text) { 
  document.getElementById("announce").textContent = text; 
}

// ====================== АУДИО ======================
let ctx = null;
let masterGain, windGain, birdGain, chimeGain, chimesGain;
let audioNodesInitialized = false;

const audioBirdsEl = document.getElementById('audio-birds');
const audioWindEl = document.getElementById('audio-wind');
const audioChimeEl = document.getElementById('audio-chime');
const audioChimesEl = document.getElementById('audio-chimes');

function initAudio() {
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  if (ctx.state === 'suspended') { ctx.resume(); }
  
  if (!audioNodesInitialized) {
    masterGain = ctx.createGain(); masterGain.gain.value = 1.0; masterGain.connect(ctx.destination);
    windGain = ctx.createGain(); windGain.gain.value = 0;
    birdGain = ctx.createGain(); birdGain.gain.value = 0;
    chimeGain = ctx.createGain(); chimeGain.gain.value = 1.0;
    chimesGain = ctx.createGain(); chimesGain.gain.value = 0;

    ctx.createMediaElementSource(audioWindEl).connect(windGain).connect(masterGain);
    ctx.createMediaElementSource(audioBirdsEl).connect(birdGain).connect(masterGain);
    ctx.createMediaElementSource(audioChimeEl).connect(chimeGain).connect(masterGain);
    ctx.createMediaElementSource(audioChimesEl).connect(chimesGain).connect(masterGain);
    
    audioNodesInitialized = true;
  }
}

function startAmbient() {
  audioBirdsEl.play().catch(()=>{});
  audioWindEl.play().catch(()=>{});
  audioChimesEl.play().catch(()=>{}); 
}

function stopAudio() {
  if (!masterGain) return;
  masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
  setTimeout(() => {
    audioBirdsEl.pause(); audioWindEl.pause(); audioChimesEl.pause();
    if(masterGain) masterGain.gain.value = 1.0; 
  }, 300);
}

function blip(correct) {
  if(!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = correct ? 880 : 220;
  g.gain.setValueAtTime(0.15, ctx.currentTime);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
  o.connect(g).connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + 0.4);
}

// ====================== ЛОГИКА ВОСПРОИЗВЕДЕНИЯ ======================
const screenEl = document.getElementById("screen");
const video = document.getElementById("clip");
const overlay = document.getElementById("screen-overlay");
const overlayText = document.getElementById("overlay-text");
const overlayBtn = document.getElementById("overlay-btn");
const caption = document.getElementById("caption");
const bellBox = document.getElementById("bell-box");
const bellIcon = document.getElementById("bell-icon");

let timeoutId = null;

function playYear(i) {
  if(state.isPlayingSegment) return;
  initAudio(); startAmbient(); clearTimeout(timeoutId); video.pause();
  
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  const ratio = Math.min(1, Math.max(0, DATA.years[i].green / CFG.GREEN_REF));
  const birdVolume = ratio * 0.95;
  const windVolume = (1 - ratio) * 0.85 + 0.15;

  birdGain.gain.setTargetAtTime(birdVolume, ctx.currentTime, 0.1);
  windGain.gain.setTargetAtTime(windVolume, ctx.currentTime, 0.1);
  chimesGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1); 

  announce(`Слушаем год ${Y(i)}.`);
  
  timeoutId = setTimeout(() => {
    birdGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
    windGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
    stopAudio();
  }, 3000);
}

function playInterval(ivIdx, isBellMode = false) {
  initAudio(); startAmbient(); clearTimeout(timeoutId);
  state.isPlayingSegment = true;
  renderUI();
  
  overlay.classList.add("hidden");
  video.classList.remove("locked");
  caption.classList.add("visible");
  
  const iv = DATA.intervals[ivIdx];
  const ratioA = Math.min(1, Math.max(0, DATA.years[ivIdx].green / CFG.GREEN_REF));
  const ratioB = Math.min(1, Math.max(0, DATA.years[ivIdx+1].green / CFG.GREEN_REF));
  
  const duration = 6.0; 
  
  birdGain.gain.setValueAtTime(ratioA * 0.95, ctx.currentTime);
  birdGain.gain.linearRampToValueAtTime(ratioB * 0.95, ctx.currentTime + duration);
  
  windGain.gain.setValueAtTime(((1 - ratioA) * 0.85 + 0.15), ctx.currentTime);
  windGain.gain.linearRampToValueAtTime(((1 - ratioB) * 0.85 + 0.15), ctx.currentTime + duration);

  chimesGain.gain.setValueAtTime(ratioA * 1.0, ctx.currentTime);
  chimesGain.gain.linearRampToValueAtTime(ratioB * 1.0, ctx.currentTime + duration);

  video.currentTime = iv.t0;
  video.playbackRate = (iv.t1 - iv.t0) / duration;
  video.play().catch(()=>{});
  caption.textContent = `Динамика ${iv.from}–${iv.to}`;
  
  announce(`Изменения с ${iv.from} по ${iv.to}`);

  timeoutId = setTimeout(() => {
    video.pause(); video.classList.add("locked"); caption.classList.remove("visible");
    birdGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
    windGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
    chimesGain.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
    stopAudio();
    bellIcon.classList.remove("ringing");
    
    state.isPlayingSegment = false;
    state.currentPair++;
    state.errors = 0;
    
    if (state.currentPair >= CFG.PAIRS.length) {
      showFinalScreen();
    } else {
      renderUI();
      announceNextPair();
    }
  }, duration * 1000);
}

function unlockSegment(idxA, idxB, isBellMode) {
  createSparks(nodes[idxA].x, nodes[idxA].y, 20);
  createSparks(nodes[idxB].x, nodes[idxB].y, 20);
  nodes[idxA].glow = 1.0; nodes[idxB].glow = 1.0;
  state.links.push({ a: idxA, b: idxB, p: 0 });
  
  if (isBellMode) {
    bellIcon.classList.add("ringing");
    audioChimeEl.currentTime = 0;
    audioChimeEl.play();
    setTimeout(() => { playInterval(state.currentPair, true); }, 2500);
  } else {
    playInterval(state.currentPair, false);
  }
}

function playAll() {
  initAudio(); startAmbient(); clearTimeout(timeoutId);
  overlay.classList.add("hidden"); video.classList.remove("locked"); caption.classList.add("visible");
  caption.textContent = "Полная динамика 1987-2018 (Соннификация)";
  state.isPlayingSegment = true;
  
  const totalDuration = DATA.intervals.length * 4.0;
  let currTime = ctx.currentTime;
  
  for(let i=0; i<DATA.intervals.length; i++) {
    const ratioA = Math.min(1, Math.max(0, DATA.years[i].green / CFG.GREEN_REF));
    const ratioB = Math.min(1, Math.max(0, DATA.years[i+1].green / CFG.GREEN_REF));
    
    if(i===0) {
      birdGain.gain.setValueAtTime(ratioA * 0.95, currTime);
      windGain.gain.setValueAtTime(((1 - ratioA) * 0.85 + 0.15), currTime);
      chimesGain.gain.setValueAtTime(ratioA * 1.0, currTime);
    }
    birdGain.gain.linearRampToValueAtTime(ratioB * 0.95, currTime + 4.0);
    windGain.gain.linearRampToValueAtTime(((1 - ratioB) * 0.85 + 0.15), currTime + 4.0);
    chimesGain.gain.linearRampToValueAtTime(ratioB * 1.0, currTime + 4.0);
    currTime += 4.0;
  }
  
  video.currentTime = DATA.intervals[0].t0;
  video.playbackRate = (DATA.intervals[DATA.intervals.length-1].t1 - DATA.intervals[0].t0) / totalDuration;
  video.play().catch(()=>{});
  
  speak(`${YEAR_WORDS[1987]} — ${YEAR_WORDS[2018]}`);
  
  setTimeout(() => {
    video.pause(); stopAudio(); video.classList.add("locked"); caption.classList.remove("visible");
    overlay.classList.remove("hidden");
    overlayText.textContent = "Полный анализ завершен!";
    overlayBtn.textContent = "Смотреть и слушать еще раз (Ctrl)";
    overlayBtn.style.display = "inline-block";
    overlayBtn.onclick = playAll;
    state.isPlayingSegment = false;
    announce("Полный анализ завершен"); 
  }, totalDuration * 1000);
}

// ====================== ВЗАИМОДЕЙСТВИЕ (UI) ======================
function answer(idx) {
  if (state.isPlayingSegment || state.currentPair >= CFG.PAIRS.length) return;
  initAudio();
  const [a, b] = CFG.PAIRS[state.currentPair];
  if (idx !== a && idx !== b) return;
  
  const qType = state.questions[state.currentPair];
  const greenA = DATA.years[a].green;
  const greenB = DATA.years[b].green;
  
  let correctIdx = (qType === 'more') ? (greenA >= greenB ? a : b) : (greenA <= greenB ? a : b);
  
  if (idx === correctIdx) {
    blip(true);
    announce(`Верно! Открываем сегмент.`);
    unlockSegment(a, b, false);
  } else {
    blip(false);
    state.errors++;
    if (state.errors >= 2) {
      announce(`Не совсем так. Хотите услышать весь кусок? Нажмите пробел, чтобы отправить импульс.`);
    } else {
      announce(`Неверно. Послушайте баланс птиц и ветра еще раз.`);
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'CapsLock') {
    toggleVoice();
  }
  
  if ((e.code === 'ControlLeft' || e.code === 'ControlRight' || e.ctrlKey) && state.isFinished && !state.isPlayingSegment) {
    e.preventDefault();
    playAll();
    return;
  }
  
  if (e.code === 'Space' || e.key === ' ') {
    if (state.isPlayingSegment || state.currentPair >= CFG.PAIRS.length) return;
    e.preventDefault();
    initAudio();
    const [a, b] = CFG.PAIRS[state.currentPair];
    announce(`Режим эха активирован. Отправляем импульс...`);
    unlockSegment(a, b, true);
  }
});

function announceNextPair() {
  if (state.currentPair >= CFG.PAIRS.length) return;
  const [a, b] = CFG.PAIRS[state.currentPair];
  announce(`Следующий участок с ${Y(a)} по ${Y(b)}.`);
  
  speak(`${YEAR_WORDS[DATA.years[a].year]} — ${YEAR_WORDS[DATA.years[b].year]}`);
}

function showFinalScreen() {
  state.isFinished = true;
  overlay.classList.remove("hidden");
  overlayText.textContent = "Победа! Нейронная сеть построена.";
  overlayBtn.textContent = "Слушать полную соннификацию (Ctrl) ▶";
  overlayBtn.style.display = "inline-block";
  overlayBtn.onclick = playAll;
  announce("Победа! Все связи построены. Открыта полная соннификация. Нажмите Контрол, чтобы прослушать.");
  speak("Нажмите Контрол, чтобы прослушать весь период.");
  bellBox.classList.add("hidden");
}

const qFloat = document.getElementById("q-float");
const nodesContainer = document.getElementById("nodes");

function renderUI() {
  if (state.currentPair >= CFG.PAIRS.length) {
    qFloat.classList.add("hidden");
    bellBox.classList.add("hidden");
    nodes.forEach(n => n.el.classList.add("hidden-ui"));
    return;
  }
  
  if (state.questions.length <= state.currentPair) {
    state.questions.push(Math.random() > 0.5 ? 'more' : 'less');
  }
  
  const qType = state.questions[state.currentPair];
  qFloat.textContent = qType === 'more' 
    ? "В каком году БОЛЬШЕ птиц?" 
    : "В каком году МЕНЬШЕ птиц?";
  
  const [a, b] = CFG.PAIRS[state.currentPair];
  
  nodes.forEach((n, i) => {
    if ((i === a || i === b) && !state.isPlayingSegment) {
      n.el.classList.remove("hidden-ui");
    } else {
      n.el.classList.add("hidden-ui");
    }
  });

  if (state.isPlayingSegment) {
    qFloat.classList.add("hidden");
    bellBox.classList.add("hidden");
  } else {
    qFloat.classList.remove("hidden");
    bellBox.classList.remove("hidden");
  }
}

// ====================== КАНВАС И ФИЗИКА ======================
const sky = document.getElementById("sky");
const g = sky.getContext("2d");
let W = innerWidth, H = innerHeight, DPR = window.devicePixelRatio || 1;
let mouse = { x: -999, y: -999 };
let sparks = [];

function resize() {
  W = innerWidth; H = innerHeight; DPR = window.devicePixelRatio || 1;
  sky.width = W * DPR; sky.height = H * DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
resize();

const stars = Array.from({ length: 150 }, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + 0.2, s: Math.random() * 2 + 0.5
}));

const nodes = DATA.years.map((y, i) => ({
  i, bx: CFG.NODE_POS[i][0], by: CFG.NODE_POS[i][1], 
  x: W * CFG.NODE_POS[i][0], y: H * CFG.NODE_POS[i][1], glow: 0,
  cloud: Array.from({ length: 50 }, () => ({
    a: Math.random() * Math.PI * 2, r: Math.pow(Math.random(), 0.6) * 35, s: Math.random() * 0.8 + 0.2
  }))
}));

nodes.forEach((n, i) => {
  const wrap = document.createElement("div"); wrap.className = "node-wrap hidden-ui";
  const hitbox = document.createElement("button"); hitbox.className = "node-hitbox";
  hitbox.setAttribute("aria-label", `Выбрать ${Y(i)} год`);
  hitbox.onclick = () => answer(i);
  
  const uiWrap = document.createElement("div"); uiWrap.className = "node-ui";
  const lbl = document.createElement("div"); lbl.className = "node-lbl"; lbl.textContent = Y(i);
  const playBtn = document.createElement("button"); playBtn.className = "node-play";
  playBtn.textContent = "🔊 Слушать";
  playBtn.setAttribute("aria-label", `Слушать звук за ${Y(i)} год`);
  playBtn.onclick = (e) => { e.stopPropagation(); playYear(i); }; 
  
  uiWrap.appendChild(lbl); uiWrap.appendChild(playBtn);
  wrap.appendChild(hitbox); wrap.appendChild(uiWrap);
  nodesContainer.appendChild(wrap); n.el = wrap;
});

function createSparks(x, y, count) {
  for (let k = 0; k < count; k++) {
    sparks.push({ 
      x: x, y: y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 1, h: Math.random() * 360 
    });
  }
}

function drawLink(l, t) {
  const A = nodes[l.a], B = nodes[l.b];
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
  const cx = (A.x + B.x)/2 - dy/len * 30, cy = (A.y + B.y)/2 + dx/len * 30;
  const steps = 30, end = Math.floor(steps * l.p);
  g.lineWidth = 2.5; g.shadowBlur = 15;
  for (let k = 1; k <= end; k++) {
    const u0 = (k - 1)/steps, u1 = k/steps, v0 = 1-u0, v1 = 1-u1;
    const p0 = { x: v0*v0*A.x + 2*v0*u0*cx + u0*u0*B.x, y: v0*v0*A.y + 2*v0*u0*cy + u0*u0*B.y };
    const p1 = { x: v1*v1*A.x + 2*v1*u1*cx + u1*u1*B.x, y: v1*v1*A.y + 2*v1*u1*cy + u1*u1*B.y };
    const hue = (l.a * 50 + t * 40 + k * 4) % 360;
    g.strokeStyle = `hsla(${hue}, 90%, 75%, 0.9)`; g.shadowColor = `hsla(${hue}, 90%, 75%, 1)`;
    g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
  }
  g.shadowBlur = 0;
}

function drawNode(n, t) {
  const halo = g.createRadialGradient(n.x, n.y, 0, n.x, n.y, 45);
  halo.addColorStop(0, `rgba(255,255,255,${0.1 + n.glow*0.6})`); halo.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = halo; g.beginPath(); g.arc(n.x, n.y, 45, 0, Math.PI * 2); g.fill();
  n.cloud.forEach(p => {
    const a = p.a + t * 0.2 * p.s, r = p.r * (1 + n.glow * 0.4);
    const x = n.x + Math.cos(a) * r, y = n.y + Math.sin(a) * r * 0.8;
    g.fillStyle = n.glow > 0.1 ? `hsla(${((p.a*180/Math.PI) + t*60) % 360}, 90%, 80%, 0.9)` : "rgba(180, 210, 255, 0.5)";
    g.beginPath(); g.arc(x, y, 1.5, 0, Math.PI*2); g.fill();
  });
}

function frame(time) {
  const t = time / 1000;
  g.clearRect(0, 0, W, H);
  g.fillStyle = "#fff";
  stars.forEach(s => {
    g.globalAlpha = 0.2 + 0.4 * Math.sin(t * s.s + s.x * 10) ** 2;
    g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); g.fill();
  });
  g.globalAlpha = 1;

  nodes.forEach((n, i) => {
    let targetX = n.bx * W + Math.sin(t * 0.5 + i) * 12, targetY = n.by * H + Math.cos(t * 0.4 + i * 1.5) * 12;
    const dx = targetX - mouse.x, dy = targetY - mouse.y, dist = Math.hypot(dx, dy);
    if (dist < 130 && dist > 0) {
      const force = (130 - dist) / 130 * 30; targetX += (dx / dist) * force; targetY += (dy / dist) * force;
    }
    n.x += (targetX - n.x) * 0.1; n.y += (targetY - n.y) * 0.1; n.glow = Math.max(0, n.glow - 0.02);
    n.el.style.transform = `translate(${n.x}px, ${n.y}px)`;
  });

  if (state.currentPair < CFG.PAIRS.length && !state.isPlayingSegment) {
    const [a, b] = CFG.PAIRS[state.currentPair];
    const mx = (nodes[a].x + nodes[b].x) / 2, my = Math.min(nodes[a].y, nodes[b].y) - 50;
    qFloat.style.left = mx + "px"; qFloat.style.top = Math.max(H * 0.35, my) + "px"; 
  }

  state.links.forEach(l => { l.p = Math.min(1, l.p + 0.03); drawLink(l, t); });
  nodes.forEach(n => drawNode(n, t));
  sparks = sparks.filter(p => p.life > 0);
  sparks.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    g.fillStyle = `hsla(${p.h}, 90%, 80%, ${p.life})`;
    g.beginPath(); g.arc(p.x, p.y, 2, 0, Math.PI*2); g.fill();
  });
  requestAnimationFrame(frame);
}

// ====================== ЗАПУСК ======================
requestAnimationFrame(frame);

overlayBtn.style.display = "inline-block";
overlayBtn.onclick = () => {
  initAudio();
  overlay.classList.add("hidden");
  renderUI();
  
  announceNextPair();
};
</script>
</body>
</html>

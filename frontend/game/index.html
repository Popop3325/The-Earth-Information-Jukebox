<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Jukebox: гра</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/game/game.css">
</head>
<body class="game-page">
  <!-- Гра «нейрони». game.js (правила) → prototype/ui-stub.js (вигляд) + prototype/sonif-stub.js (звук).
       Відео зверху: <video id="clip">. Усе ES-модулі. -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <nav class="game-nav"><a href="/">← Джукбокс</a> · <a href="/static/game/prototype/index.html">оригінальний прототип</a></nav>
  <h1 class="sr-only">Почуй, як змінюється Земля</h1>

  <button id="voice-toggle" class="btn" type="button">🔊 Озвучення (CapsLock)</button>

  <!-- Вікно відео зверху. Не відкривається і не закривається: змінюється лише розмиття -->
  <section id="screen" aria-label="Вікно відео">
    <div id="video-container">
      <video id="clip" muted playsinline preload="auto" class="locked"></video>
      <div id="screen-overlay">
        <p id="overlay-text">Ініціалізація…</p>
        <button id="overlay-btn" class="btn" type="button" style="display:none;"></button>
      </div>
      <div id="caption" aria-hidden="true"></div>
    </div>
    <div id="bell-box" class="hidden" aria-hidden="true">
      <div id="bell-icon">🔔</div>
      <div class="bell-key">Пробіл</div>
    </div>
  </section>

  <div id="q-float" class="hidden"></div>
  <div id="nodes" aria-label="Нейрони. Оберіть відповідь"></div>
  <div id="hint"></div>
  <p id="score" class="note"></p>

  <!-- Для скрінрідерів: оголошення подій гри -->
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>

  <script type="module" src="/static/game/game.js"></script>
</body>
</html>

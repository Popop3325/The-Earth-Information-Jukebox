<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Jukebox: гра</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/game/game.css">
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
</head>
<body>
  <!-- ЗАГОТОВКА гри. Логіка працює, вигляд — простий.
       Візуал «нейронів» і зоряного неба переносить №5 з prototype/index.html. -->
  <header>
    <h1 id="title">Почуй, як змінюється Земля</h1>
    <p><a href="/">← Джукбокс</a> · <a href="/static/game/prototype/index.html">оригінальний прототип</a></p>
  </header>

  <main>
    <video id="video" muted playsinline preload="auto"></video>
    <p id="question" class="question"></p>
    <div id="years" class="years"></div>
    <div class="controls">
      <button id="start-btn" type="button">▶ Почати</button>
      <button id="hint-btn" type="button" hidden>🔔 Підказка (пробіл)</button>
    </div>
    <p id="score" class="note"></p>
    <!-- Для скрінрідерів: оголошення подій гри -->
    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="/static/game/game.js"></script>
</body>
</html>
